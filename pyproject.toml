[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snaplist"
version = "0.1.0"
description = "Open-source, local-first tool that groups photos into marketplace listings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pillow>=10.4",
    "httpx>=0.27",
    "litellm>=1.50",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
cleanup = ["rembg>=2.0.56"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
snaplist = "snaplist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
